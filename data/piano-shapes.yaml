note: 'Numbers are semitones above the root, low to high; over 11 means the next octave up, so C-G-D-E
  is [0, 7, 14, 16]. `close` is root position, ascending, with any extension stacked above the octave
  -- the chord as you spell it at a keyboard, and the only voicing the piano pages print. `open` is the
  worship voicing from piano.pdf: root and fifth low for weight, colour above, the third high and out
  of the bass player''s way. It is kept here rather than printed -- the pages show one voicing per chord
  -- so the worksheet import is not lost and can be brought back by editing tools/piano.py.'
