# Instrument definitions.
#
# `tuning` is written LOW string first, using scientific pitch notation, and is
# the order fret digits appear in throughout data/voicings/*.yaml.
#
# `frets` is the highest fret number the printed diagrams need to accommodate.
#
# `courses` documents doubled strings (mandolin/12-string). They are irrelevant
# to pitch-class validation, so the tuning lists one entry per *course*.

# `kind` says how a voicing is written: `frets` means one number per string,
# `notes` means note names low to high. Everything else in the pipeline
# branches on this and nothing else.

mandolin:
  # Short scale, four courses -- diagonals reach a long way.
  max_span: 4        # frets covered without shifting
  max_diagonal: 7    # more, when it is one finger per string
  kind: frets
  name: Mandolin
  also_covers: [Fiddle, "Tenor banjo"]
  tuning: [G3, D4, A4, E5]
  courses: 2
  frets: 12
  # Fiddle is fretless but tuned identically; the numbers read as
  # semitones above the open string.
  note: >-
    Tuned in fifths. Fiddle and tenor banjo share it, so the mandolin
    pages serve all three.

guitar:
  # Six strings, so it can carry the chords the four course
  # instruments cannot spell without dropping half of them.
  extra_vocabulary: ["11", "13", "m13", "maj13", "7#11"]
  # Long scale: four frets in one hand position, no more.
  max_span: 3        # frets covered without shifting
  max_diagonal: 5    # more, when it is one finger per string
  kind: frets
  name: Guitar
  tuning: [E2, A2, D3, G3, B3, E4]
  courses: 1
  frets: 12
  note: >-
    Standard. A baritone ukulele is the top four strings: guitar shapes
    with the lowest two muted transfer directly.

bass:
  tuning_label: "(B) E A D G"
  # Longest scale of the lot.
  max_span: 3        # frets covered without shifting
  max_diagonal: 5    # more, when it is one finger per string
  kind: frets
  name: Bass
  tuning: [E1, A1, D2, G2]
  courses: 1
  frets: 12
  note: >-
    The guitar's lowest four strings, an octave down.

ukulele:
  # Short scale, four strings.
  max_span: 4        # frets covered without shifting
  max_diagonal: 6    # more, when it is one finger per string
  kind: frets
  name: Ukulele
  tuning: [G4, C4, E4, A4]
  courses: 1
  frets: 12
  note: >-
    Soprano, concert and tenor. Re-entrant: the 4th sounds above the 3rd,
    so "lowest first" means leftmost. Low-G is the same.
  reentrant: true

banjo:
  tuning_label: "(G) D G B D"
  # Guitar-ish scale but only four strings fretted.
  max_span: 4        # frets covered without shifting
  max_diagonal: 6    # more, when it is one finger per string
  kind: frets
  name: Banjo
  tuning: [D3, G3, B3, D4]
  drone: G4
  courses: 1
  frets: 12
  note: >-
    Open G (gDGBD). Numbers cover the four long strings; the 5th is a
    drone, spiked rather than fretted.

piano:
  kind: notes
  name: Piano
  frets: 0
  note: >-
    Note names, low to high, as played.
