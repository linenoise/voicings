# Instrument definitions.
#
# `tuning` is written LOW string first, using scientific pitch notation, and is
# the order fret digits appear in throughout data/voicings/*.yaml.
#
# `frets` is the highest fret number the printed diagrams need to accommodate.
#
# `courses` documents doubled strings (mandolin/12-string). They are irrelevant
# to pitch-class validation, so the tuning lists one entry per *course*.

# `kind` says how a voicing is written: `frets` means one number per string,
# `notes` means note names low to high. Everything else in the pipeline
# branches on this and nothing else.

mandolin:
  kind: frets
  name: Mandolin
  also_covers: [Fiddle, "Tenor banjo"]
  tuning: [G3, D4, A4, E5]
  courses: 2
  frets: 12
  # Fiddle is fretless but tuned identically; the numbers read as
  # semitones above the open string.
  note: >-
    Tuned in fifths. Fiddle and tenor banjo share this tuning, so this
    section serves all three instruments.

guitar:
  kind: frets
  name: Guitar
  tuning: [E2, A2, D3, G3, B3, E4]
  courses: 1
  frets: 12
  note: >-
    Standard tuning. A baritone ukulele is the top four strings (D G B E),
    so any guitar shape with its lowest two strings muted transfers directly.

bass:
  kind: frets
  name: Bass
  tuning: [E1, A1, D2, G2]
  courses: 1
  frets: 12
  note: >-
    Standard four-string bass: the guitar's lowest four strings, one octave down.

ukulele:
  kind: frets
  name: Ukulele
  tuning: [G4, C4, E4, A4]
  courses: 1
  frets: 12
  note: >-
    Soprano, concert and tenor re-entrant tuning. The 4th string sounds
    ABOVE the 3rd, so "lowest string first" here means leftmost, not lowest
    pitched. Low-G ukuleles use the same shapes.
  reentrant: true

banjo:
  kind: frets
  name: Banjo
  tuning: [D3, G3, B3, D4]
  drone: G4
  courses: 1
  frets: 12
  note: >-
    Five-string banjo in open G (gDGBD). The 5th (drone) string is not
    fretted in these shapes; it rings G and is omitted from the fret
    numbers, which cover the four long strings only.

piano:
  kind: notes
  name: Piano
  frets: 0
  note: >-
    Voicings are note names, low to high, for the right hand with the root
    in the left. Fifths stay open and the third sits high, out of the bass
    player's way. Shapes come from data/piano-shapes.yaml; edit there.
